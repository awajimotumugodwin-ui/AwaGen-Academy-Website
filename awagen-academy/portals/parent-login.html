<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Parent Portal login demonstration for AwaGen Academy.">
    <title>Parent Portal Login | AwaGen Academy</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>
    <main class="login-page">
        <section class="login-card"><a class="brand" href="../index.html" aria-label="AwaGen Academy home">
                <span class="logo-mark" aria-hidden="true"></span><span><span class="brand-name">AwaGen
                        Academy</span><small>Technology. Development. Integrity.</small></span>
            </a><span class="eyebrow">PARENT PORTAL</span>
            <h1>Parent Portal</h1>
            <p>Secure school information interface.</p>
            <form action="parent-dashboard.html" method="get">
                <div class="form-group"><label for="id">Email / Parent ID</label><input class="form-control" id="id"
                        required></div>
                <div class="form-group"><label for="pw">Password</label><input class="form-control" id="pw"
                        type="password" required></div>
                <div class="login-meta"><label><input type="checkbox"> Remember me</label><a href="#">Forgot
                        Password?</a></div><button class="btn btn-secondary" style="width:100%" type="submit">Sign
                    In</button>
            </form>
            <div class="login-note">Demo interface — authentication requires a backend.</div><a class="btn btn-outline"
                style="width:100%;margin-top:12px" href="../index.html">← Back to Website</a>
        </section>
    </main>
</body>

</html>
